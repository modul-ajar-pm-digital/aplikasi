// ===================================================================

const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const nl=s=>gam(esc(s).replace(/\n/g,'<br>'));
let D=JSON.parse(localStorage.getItem('modul')||'null')||{id:null,v:{mapel:'PJOK',fase:'Fase A / Kelas I',jenjang:'SD',sekolah:'SD Negeri 1 Dauhwaru',tahun:'2026/2027'},p:[{}]};

id:{t:'Identitas',f:[['penyusun','Penyusun'],['sekolah','Sekolah'],['tahun','Tahun Penyusunan'],['jenjang','Jenjang Sekolah'],['mapel','Mata Pelajaran'],['fase','Fase / Kelas / Semester'],['bab','Bab'],['subbab','Sub Bab'],['waktu','Alokasi Waktu']]},

as:{t:'Asesmen & Lampiran',ai:1,f:[['diagnostik','Asesmen Awal (Diagnostik): tujuan, waktu, teknik, instrumen, indikator, interpretasi hasil','t'],['formatif','Asesmen Formatif: teknik, instrumen, indikator, waktu, umpan balik','t'],['sumatif','Asesmen Sumatif: bentuk, cakupan, instrumen, kriteria, waktu','t'],['remedial','Tindak Lanjut: Remedial','t'],['pengayaan','Tindak Lanjut: Pengayaan','t'],['rubrik','Rubrik Asesmen (3 aspek, skala 4-1, dalam bentuk baris: Aspek | Sangat Baik | Baik | Cukup | Perlu Bimbingan, dipisah tanda |)','t'],['lkpd','LKPD (petunjuk kerja, kegiatan, refleksi murid)','t'],['materi','Materi Ajar (konsep, langkah, contoh, rangkuman)','t'],['glosarium','Glosarium (Istilah: definisi, satu per baris)','t'],['pustaka','Daftar Pustaka','t'],['penutup','Penutup modul','t']]},
};
const PF=[['model','Model Pembelajaran'],['metode','Metode'],['waktu','Alokasi Waktu'],['tujuan','Tujuan Pembelajaran','t'],['awal_w','Waktu Kegiatan Awal (menit)'],['awal','AWAL: bernomor 1-5 (pembukaan/doa/presensi; Berkesadaran; Bermakna; Menggembirakan; tujuan & apersepsi)','t'],['inti_w','Waktu Kegiatan Inti (menit)'],['memahami','INTI - MEMAHAMI','t'],['mengaplikasikan','INTI - MENGAPLIKASIKAN','t'],['merefleksi','INTI - MEREFLEKSI','t'],['tutup_w','Waktu Penutup (menit)'],['tutup','PENUTUP: bernomor (simpulan, refleksi/perasaan murid, tindak lanjut)','t']];
const ST=[...Object.keys(F).map(k=>({k,t:F[k].t})).slice(0,1),{k:'bk',t:'Buku Referensi'},...Object.keys(F).map(k=>({k,t:F[k].t})).slice(1,3),{k:'pg',t:'Pengalaman Belajar'},{k:'as',t:F.as.t},{k:'ex',t:'Pratinjau & Ekspor'}];
function save(){localStorage.setItem('modul',JSON.stringify(D))}
// ===== Buku referensi (PDF/TXT) =====
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let REF={nama:'',teks:'',hal:'',on:true};
try{REF=Object.assign(REF,JSON.parse(localStorage.getItem('ref')||'{}'))}catch(e){}
let PDFDOC=null,PDFNAMA='',TXTBUF=null,HA=1,HZ=30;
const MAXREF=120000;
function saveRef(){try{localStorage.setItem('ref',JSON.stringify(REF))}catch(e){alert('Memori browser penuh. Kurangi rentang halaman.')}}
function refTxt(){return REF.on&&REF.teks?`\nBUKU PELAJARAN REFERENSI (${REF.nama}, ${REF.hal}). Jadikan sumber utama untuk materi, istilah, contoh, dan urutan pembahasan. Jangan membuat isi yang bertentangan dengan buku. Untuk Materi Ajar dan Daftar Pustaka, rujuk buku ini.\n<<<BUKU\n${REF.teks}\nBUKU>>>\n`:''}
function bukuUI(){
 const info=PDFDOC?`PDF terbuka: ${esc(PDFNAMA)} (${PDFDOC.numPages} halaman)`:(TXTBUF!=null?`TXT terbuka: ${esc(PDFNAMA)}`:'');
 const ada=REF.teks?`<p>✔ <b>${esc(REF.nama)}</b> (${esc(REF.hal)}), ${REF.teks.length.toLocaleString('id-ID')} karakter tersimpan di browser ini.</p>
 <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" style="width:auto" ${REF.on?'checked':''} onchange="REF.on=this.checked;saveRef()"> Pakai buku ini sebagai referensi AI</label>
 <details><summary class="m">Lihat cuplikan teks</summary><pre style="white-space:pre-wrap;font-size:12px;max-height:200px;overflow:auto">${esc(REF.teks.slice(0,1500))}</pre></details>
 <div class="row"><button class="s" onclick="hapusRef()">🗑 Hapus referensi</button></div>`:'<p class="m">Belum ada buku referensi tersimpan.</p>';
 return `<div class="card"><b>📚 Buku Pelajaran sebagai Referensi AI</b>
 <p class="m">Unggah buku (PDF atau TXT), pilih halaman bab yang akan diajarkan, lalu ekstrak. Teks itu dikirim ke AI sebagai sumber saat Generate. Batas sekitar ${MAXREF.toLocaleString('id-ID')} karakter (±40 halaman), jadi pilih halaman yang relevan saja. File PDF tidak diunggah ke server, hanya teks terpilih yang dikirim saat Generate.</p>
 <label>File buku</label><input type="file" accept=".pdf,.txt" onchange="pilihBuku(this.files[0])">
 <div id="bkInfo" class="m">${info}</div>
 <div class="row"><div style="flex:1"><label>Dari halaman</label><input id="h1" type="number" min="1" value="${HA}" ${TXTBUF!=null?'disabled':''}></div><div style="flex:1"><label>Sampai halaman</label><input id="h2" type="number" min="1" value="${HZ}" ${TXTBUF!=null?'disabled':''}></div></div>
 <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="autoGbr" checked style="width:auto"> Sekalian cari gambar buku dengan AI (otomatis, perlu masuk akun)</label>
 <div class="row"><button class="g" onclick="ekstrak(this)">📥 Ekstrak teks & gambar</button></div></div>
 <div class="card">${ada}</div>
 <div class="card"><b>🖼 Gambar dari Buku</b>
 <p class="m">Gambar dicari otomatis oleh AI dari halaman yang Anda ekstrak, lengkap dengan keterangannya. Saat Generate, AI menyisipkan gambar ke Materi Ajar, LKPD, atau kegiatan yang sesuai. Gambar yang tidak terpakai masuk ke "Galeri Gambar" di lampiran. Anda bisa mengubah keterangan atau menghapus gambar yang kurang pas. Maksimal 15 gambar, hanya untuk PDF.</p>
 <div class="row"><button class="g" onclick="cariUlang(this)">🔄 Cari ulang gambar dengan AI</button></div>
 <details><summary class="m">Tambah gambar manual (opsional)</summary>
 <div class="row"><input id="hg" type="number" min="1" value="${HA}" style="width:110px"><button class="g" onclick="lihatHal()">Tampilkan halaman</button><button class="s" onclick="stepHal(-1)">◀</button><button class="s" onclick="stepHal(1)">▶</button></div>
 <div id="pvBox"></div>
 <label>Keterangan gambar</label><input id="kp" placeholder="mis. Anak melempar bola dengan dua tangan">
 <div class="row"><button onclick="tambahGbr()">➕ Tambahkan ke modul</button></div>
 </details>
 <div id="gal">${galeriHtml()}</div></div>`}
async function pilihBuku(f){
 if(!f)return;const info=$('bkInfo');
 try{
  if(/\.txt$/i.test(f.name)){PDFDOC=null;PDFNAMA=f.name;TXTBUF=await f.text();info.textContent=`TXT: ${f.name} (${TXTBUF.length.toLocaleString('id-ID')} karakter)`;$('h1').disabled=true;$('h2').disabled=true;return}
  if(!window.pdfjsLib)throw Error('Pustaka PDF belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
  info.textContent='Membuka PDF...';
  PDFDOC=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;PDFNAMA=f.name;TXTBUF=null;
  HA=1;HZ=Math.min(PDFDOC.numPages,30);
  info.textContent=`${f.name}: ${PDFDOC.numPages} halaman. Pilih rentang halaman bab yang dipakai.`;
  $('h1').disabled=false;$('h2').disabled=false;$('h1').value=HA;$('h2').value=HZ;
 }catch(e){info.textContent='';alert('Gagal membuka file: '+e.message)}}
function ekstrak(b){run(b,async()=>{
 let t='',hal='';
 if(TXTBUF!=null){t=TXTBUF.slice(0,MAXREF);hal='teks lengkap'}
 else{
  if(!PDFDOC)throw Error('Pilih file buku dulu.');
  const a=Math.max(1,+$('h1').value||1);let z=Math.min(PDFDOC.numPages,+$('h2').value||a);
  if(a>z)throw Error('Rentang halaman tidak valid.');
  HA=a;HZ=z;
  for(let i=a;i<=z;i++){
   const pg=await PDFDOC.getPage(i),c=await pg.getTextContent();
   t+=`\n[Hal. ${i}]\n`+c.items.map(x=>x.str+(x.hasEOL?'\n':'')).join(' ').replace(/[ \t]+/g,' ');
   if(t.length>MAXREF){t=t.slice(0,MAXREF);z=i;break}
  }
  hal=`hal. ${a}-${z}`;HZ=z;
  if(t.replace(/\[Hal\. \d+\]/g,'').trim().length<200)throw Error('Teks hampir kosong. PDF ini kemungkinan hasil scan (berupa gambar). Gunakan PDF yang teksnya bisa diblok/disalin.');
 }
 REF={nama:PDFNAMA,teks:t.trim(),hal,on:true};saveRef();
 let pesan='';
 if(PDFDOC&&$('autoGbr')&&$('autoGbr').checked){
  try{const r=await cariGambarCore(HA,HZ,x=>{b.textContent=x});pesan=`Teks dan ${r.n} gambar berhasil disiapkan.`+(r.gagal?` (${r.gagal} kelompok halaman gagal diproses, bisa dicoba lagi lewat "Cari ulang gambar".)`:'')}
  catch(e){pesan='Teks tersimpan, tetapi pencarian gambar gagal: '+e.message}
 }
 render();if(pesan)alert(pesan);
})}
function hapusRef(){if(confirm('Hapus buku referensi?')){REF={nama:'',teks:'',hal:'',on:true};saveRef();render()}}
// ===== Gambar dari buku =====
let IMG=[];try{IMG=JSON.parse(localStorage.getItem('img')||'[]')}catch(e){}
let PV={n:0,sel:null},USED=new Set();
function saveImg(){try{localStorage.setItem('img',JSON.stringify(IMG))}catch(e){alert('Memori browser penuh. Hapus beberapa gambar.')}}
const fig=(n,g)=>{const dw=Math.min(g.w,420),dh=Math.round(g.h*dw/g.w);return `<span style="display:block;text-align:center;margin:6px 0"><img src="${g.s}" data-n="${n}" width="${dw}" height="${dh}"><br><i style="font-size:12px">Gambar ${n}. ${esc(g.c)} (Sumber: ${esc((REF.nama||'buku pelajaran').replace(/\.pdf$/i,''))}, hal. ${g.hal})</i></span>`};
const gam=h=>h.replace(/\[GAMBAR\s*(\d+)\]/gi,(m,n)=>{const g=IMG[n-1];if(!g)return '';USED.add(+n);return fig(n,g)});
function imgTxt(){return IMG.length?`\nGAMBAR TERSEDIA dari buku. Sisipkan penanda persis seperti tertulis, contoh [GAMBAR 2], pada baris tersendiri di dalam isian yang sesuai (misalnya Materi Ajar, LKPD, atau kegiatan pembelajaran), gunakan sebanyak mungkin gambar yang relevan dengan isi isian itu (jangan memakai gambar yang sama dua kali dalam satu isian). Rujuk gambar di teks, misalnya "perhatikan Gambar 2":\n${IMG.map((g,i)=>`[GAMBAR ${i+1}] = hal. ${g.hal}; keterangan: ${g.c}`).join('\n')}\n`:''}
function galeriHtml(){return IMG.length?IMG.map((g,i)=>`<div class="row" style="align-items:flex-start"><img src="${g.s}" style="width:110px;border:1px solid var(--b);border-radius:6px"><div style="flex:1;min-width:180px"><b>[GAMBAR ${i+1}]</b> <span class="m">hal. ${g.hal}</span><input value="${esc(g.c).replace(/"/g,'&quot;')}" oninput="IMG[${i}].c=this.value;saveImg()"><button class="s" style="margin-top:6px" onclick="hapusGbr(${i})">Hapus</button></div></div>`).join(''):'<p class="m">Belum ada gambar dipilih.</p>'}
function galeri(){const e=$('gal');if(e)e.innerHTML=galeriHtml()}
function hapusGbr(i){if(confirm('Hapus gambar ini? Nomor gambar setelahnya akan bergeser, jadi periksa lagi penanda [GAMBAR n] di teks.')){IMG.splice(i,1);saveImg();galeri()}}
function stepHal(d){const e=$('hg');e.value=Math.max(1,(+e.value||1)+d);lihatHal()}
async function lihatHal(){
 try{
  if(!PDFDOC)throw Error('Pilih file PDF buku dulu di bagian atas (file TXT tidak berisi gambar).');
  const n=Math.min(PDFDOC.numPages,Math.max(1,+$('hg').value||1));$('hg').value=n;
  const box=$('pvBox');box.innerHTML='<p class="m">Memuat halaman...</p>';
  const pg=await PDFDOC.getPage(n),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:1100/v0.width});
  box.innerHTML=`<div id="pvW" style="position:relative;touch-action:none;user-select:none"><canvas id="pvC" style="width:100%;height:auto;display:block;border:1px solid var(--b)"></canvas><div id="pvS" style="position:absolute;border:2px dashed #7c3aed;background:#7c3aed33;display:none;pointer-events:none"></div></div>`;
  const c=$('pvC');c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  PV={n,sel:null};const W=$('pvW');let st=null;
  W.onpointerdown=e=>{const r=c.getBoundingClientRect();st={x:e.clientX-r.left,y:e.clientY-r.top};W.setPointerCapture(e.pointerId)};
  W.onpointermove=e=>{if(!st)return;const r=c.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left)),y=Math.max(0,Math.min(r.height,e.clientY-r.top)),L=Math.min(st.x,x),T=Math.min(st.y,y),w=Math.abs(x-st.x),h=Math.abs(y-st.y);Object.assign($('pvS').style,{display:'block',left:L+'px',top:T+'px',width:w+'px',height:h+'px'});PV.sel={L,T,W:w,H:h,rw:r.width}};
  W.onpointerup=()=>{st=null};
 }catch(e){alert(e.message)}}
function tambahGbr(){
 const c=$('pvC');if(!c)return alert('Tampilkan halaman buku dulu.');
 if(IMG.length>=15)return alert('Maksimal 15 gambar agar memori browser cukup.');
 let sx=0,sy=0,sw=c.width,sh=c.height;const s=PV.sel;
 if(s&&s.W>10&&s.H>10){const k=c.width/s.rw;sx=s.L*k;sy=s.T*k;sw=s.W*k;sh=s.H*k}
 const sc=Math.min(1,700/sw),o=document.createElement('canvas');o.width=Math.round(sw*sc);o.height=Math.round(sh*sc);
 const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(c,sx,sy,sw,sh,0,0,o.width,o.height);
 IMG.push({s:o.toDataURL('image/jpeg',0.8),w:o.width,h:o.height,c:$('kp').value.trim()||'Ilustrasi dari buku',hal:PV.n});
 saveImg();$('kp').value='';PV.sel=null;$('pvS').style.display='none';galeri()}
// Pencarian gambar otomatis: AI melihat halaman PDF, menandai kotak gambar + keterangan, lalu dipotong di browser
async function cariGambarCore(a,z,prog){
 z=Math.min(z,a+29);const pages=[];for(let i=a;i<=z;i++)pages.push(i);
 const hasil=[];let gagal=0,batch=0,err='';
 for(let s=0;s<pages.length;s+=5){
  const grp=pages.slice(s,s+5),hi=[],imgs=[];batch++;
  if(prog)prog(`⏳ Mencari gambar hal. ${grp[0]}-${grp[grp.length-1]}...`);
  for(const n of grp){
   const pg=await PDFDOC.getPage(n),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:1100/v0.width});
   const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
   await pg.render({canvasContext:c.getContext('2d'),viewport:vp,background:'#fff'}).promise;
   const t=document.createElement('canvas');t.width=640;t.height=Math.round(640*c.height/c.width);
   t.getContext('2d').drawImage(c,0,0,t.width,t.height);
   hi.push({n,c});imgs.push({mime:'image/jpeg',data:t.toDataURL('image/jpeg',0.7).split(',')[1]});
  }
  const prompt=`Anda menerima ${grp.length} halaman buku pelajaran SD sebagai gambar, berurutan: ${grp.map((n,i)=>`gambar ke-${i+1} = hal. ${n}`).join('; ')}.\nTemukan ILUSTRASI, foto, diagram, atau gambar peraga yang bermakna untuk pembelajaran (misalnya contoh gerakan, tokoh, alat, peta, bagan). Abaikan dekorasi latar (awan, pita, ikon kecil), logo, nomor halaman, header/footer, dan halaman yang hanya berisi teks.\nUntuk tiap gambar beri kotak pembatas yang memuat SELURUH gambar (semua figur dalam satu adegan) tanpa paragraf teks di sekitarnya, dengan koordinat ternormalisasi 0-1000 berurutan [ymin,xmin,ymax,xmax]. Maksimal 3 gambar terbaik per halaman. "keterangan" berisi satu kalimat Bahasa Indonesia yang menjelaskan isi gambar secara konkret.\nKembalikan HANYA JSON: {"gambar":[{"hal":10,"box":[ymin,xmin,ymax,xmax],"keterangan":"..."}]}. Jika tidak ada gambar: {"gambar":[]}.`;
  let r;try{r=await callAI(prompt,imgs)}catch(e){gagal++;err=e.message;continue}
  for(const g of (r.gambar||[])){
   const o=hi.find(h=>h.n==+g.hal);let [y1,x1,y2,x2]=(g.box||[]).map(Number);
   if(!o||[y1,x1,y2,x2].some(isNaN))continue;
   y1=Math.max(0,y1-12);x1=Math.max(0,x1-12);y2=Math.min(1000,y2+12);x2=Math.min(1000,x2+12);
   const bw=x2-x1,bh=y2-y1;if(bw<80||bh<80||bw*bh>850000)continue;
   const c=o.c,sx=x1/1000*c.width,sy=y1/1000*c.height,sw=bw/1000*c.width,sh=bh/1000*c.height,sc=Math.min(1,700/sw),cv=document.createElement('canvas');
   cv.width=Math.round(sw*sc);cv.height=Math.round(sh*sc);
   const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(c,sx,sy,sw,sh,0,0,cv.width,cv.height);
   hasil.push({s:cv.toDataURL('image/jpeg',0.8),w:cv.width,h:cv.height,c:String(g.keterangan||'Ilustrasi dari buku').slice(0,160),hal:o.n,auto:true,area:bw*bh});
  }
 }
 if(!hasil.length&&gagal==batch)throw Error(err);
 const manual=IMG.filter(g=>!g.auto),sisa=Math.max(0,15-manual.length);
 const pilih=hasil.sort((p,q)=>q.area-p.area).slice(0,sisa).sort((p,q)=>p.hal-q.hal);
 IMG=manual.concat(pilih);saveImg();
 return {n:pilih.length,gagal}}
function cariUlang(b){run(b,async()=>{
 if(!PDFDOC)throw Error('Buka file PDF buku dulu di bagian atas.');
 const a=Math.max(1,+$('h1').value||1),z=Math.min(PDFDOC.numPages,+$('h2').value||a);
 if(a>z)throw Error('Rentang halaman tidak valid.');
 const r=await cariGambarCore(a,z,x=>{b.textContent=x});
 galeri();alert(`${r.n} gambar ditemukan.`+(r.gagal?` ${r.gagal} kelompok halaman gagal diproses.`:''))
})}

function render(){
 $('nav').innerHTML=ST.map((s,i)=>`<button class="${i==step?'on':''}" onclick="step=${i};render()">${i+1}. ${s.t}</button>`).join('');
 const s=ST[step];let h='';
 if(s.k=='ex'){h=`<div class="row np"><button onclick="dl()">⬇ Unduh Word (.doc)</button><button class="s" onclick="print()">🖨 Cetak / PDF</button></div>
 <div class="card np"><b>Penandatangan</b>${[['kepsek','Nama Kepala Sekolah'],['nipk','NIP Kepala Sekolah'],['guru','Nama Guru'],['nipg','NIP Guru'],['tempat','Tempat, tanggal']].map(f=>fld('v',f,D.v)).join('')}</div><div id="prev">${doc()}</div>`}

 <div class="row"><button class="g" onclick="genAll()">✨ Generate semua pertemuan</button></div><p class="m">Isi dulu Identitas, Murid, dan Desain agar hasil AI relevan.</p></div>`+D.p.map((p,i)=>`<div class="card"><div class="row"><b style="flex:1">Pertemuan Ke-${i+1}</b><button class="g" onclick="genP(${i},this)">✨ Generate</button></div>${PF.map(f=>fld('p.'+i,f,p)).join('')}</div>`).join('')}
 else{const g=F[s.k];h=`<div class="card">${g.ai?`<div class="row"><button class="g" onclick="genS('${s.k}',this)">✨ Generate dengan AI</button><span class="m">Isian yang sudah ada akan ditimpa; Anda tetap bisa mengedit.</span></div>`:''}${g.f.map(f=>fld('v',f,D.v)).join('')}</div>`}
 $('main').innerHTML=h+(s.k!='ex'?`<div class="row np"><button class="s" onclick="step=Math.max(0,step-1);render()">← Kembali</button><button onclick="step=Math.min(ST.length-1,step+1);render()">Lanjut →</button></div>`:'');
}
function npert(n){while(D.p.length<n)D.p.push({});D.p.length=n;save();render()}
async function token(){if(!sb)throw Error('Isi CFG.URL dan CFG.KEY di index.html terlebih dahulu.');const{data}=await sb.auth.getSession();if(!data.session){authD.showModal();throw Error('Silakan masuk dulu untuk memakai AI.')}return data.session.access_token}
function ctx(){const v=D.v;return `Identitas modul: ${['sekolah','tahun','jenjang','mapel','fase','bab','subbab','waktu'].map(k=>k+'='+(v[k]||'-')).join('; ')}.\nKesiapan murid: ${v.kesiapan||'-'}\nKarakteristik materi: ${v.karakteristik||'-'}\nCP: ${v.cp||'-'}\nTujuan: ${v.tujuan||'-'}\nTopik: ${v.topik||'-'}\nModel: ${v.model||'-'}; Metode: ${v.metode||'-'}`}
async function ai(fields,extra){
 const prompt=`Anda ahli kurikulum Indonesia (Kurikulum Merdeka, Pembelajaran Mendalam: Berkesadaran, Bermakna, Menggembirakan; tahapan Memahami-Mengaplikasikan-Merefleksi). Susun isi modul ajar yang praktis, kontekstual untuk murid SD, berbahasa Indonesia baku.\n${ctx()}\n${refTxt()}${imgTxt()}${extra||''}\nKembalikan HANYA objek JSON valid tanpa markdown, dengan kunci dan isi berikut (semua nilai string, gunakan \\n untuk baris baru):\n`+fields.map(f=>`"${f[0]}": ${f[1]}`).join('\n');
 return callAI(prompt)}
async function callAI(prompt,images){
 const r=await fetch(CFG.URL+'/functions/v1/generate-modul',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await token(),apikey:CFG.KEY},body:JSON.stringify(images?{prompt,images}:{prompt}),signal:AbortSignal.timeout(150000)});
 const j=await r.json();if(j.error||!j.text)throw Error(j.error||'AI tidak merespons');
 const m=j.text.match(/\{[\s\S]*\}/);return JSON.parse(m[0])}
async function run(btn,fn){const o=btn.textContent;btn.textContent='⏳ Menghasilkan...';btn.classList.add('ld');try{await fn()}catch(e){alert(e.name=='TimeoutError'?'AI terlalu lama merespons (lebih dari 2,5 menit). Coba lagi sebentar lagi.':e.message)}btn.textContent=o;btn.classList.remove('ld')}
const strip=s=>s.split(' (')[0].split(':')[0];
function genS(k,b){run(b,async()=>{const r=await ai(F[k].f.map(f=>[f[0],f[1]]));for(const f of F[k].f)if(r[f[0]]!=null)D.v[f[0]]=typeof r[f[0]]=='string'?r[f[0]]:JSON.stringify(r[f[0]]);save();render()})}
function genP(i,b){return run(b,async()=>{const r=await ai(PF.map(f=>[f[0],f[1]]),`Ini pertemuan ke-${i+1} dari ${D.p.length} pertemuan. Pastikan alur antar pertemuan berkesinambungan.`);for(const f of PF)if(r[f[0]]!=null)D.p[i][f[0]]=String(r[f[0]]);save();render()})}
async function genAll(){for(let i=0;i<D.p.length;i++){const b=document.querySelectorAll('.card .g')[i+1];await genP(i,b||document.createElement('b'))}}
const tr=(a,b)=>`<tr><td width="30%"><b>${a}</b></td><td>${nl(b)}</td></tr>`;

<h3>IDENTITAS</h3><table>${[['Penyusun','penyusun'],['Sekolah','sekolah'],['Tahun Penyusunan','tahun'],['Jenjang Sekolah','jenjang'],['Mata Pelajaran','mapel'],['Fase / Kelas / Semester','fase'],['Bab','bab'],['Sub Bab','subbab'],['Alokasi Waktu','waktu']].map(a=>tr(a[0],v[a[1]])).join('')}</table>
<h3>IDENTIFIKASI MURID</h3><table>${tr('Kesiapan Murid',v.kesiapan)+tr('Karakteristik Materi Pelajaran',v.karakteristik)+tr('Dimensi Profil Lulusan',v.dimensi)}</table>
<h3>DESAIN PEMBELAJARAN</h3><table>${tr('Capaian Pembelajaran (CP)',v.cp)+tr('Lintas Disiplin Ilmu',v.lintas)+tr('Tujuan Pembelajaran',v.tujuan)+tr('Topik Pembelajaran',v.topik)+tr('Praktik Pedagogis',`Model: ${v.model||''}\nPendekatan: Pembelajaran Mendalam (Berkesadaran, Bermakna, Menggembirakan)\nMetode: ${v.metode||''}`)+tr('Kemitraan Pembelajaran',v.kemitraan)+tr('Lingkungan Pembelajaran',`Ruang fisik: ${v.rfisik||''}\nRuang virtual: ${v.rvirtual||''}\nBudaya belajar: ${v.budaya||''}`)+tr('Pemanfaatan Digital',v.digital)}</table><h3>PENGALAMAN BELAJAR</h3>`;
 D.p.forEach((p,i)=>{h+=`<h4>Pertemuan Ke-${i+1}</h4><table>${tr('Model Pembelajaran',p.model)+tr('Metode',p.metode)+tr('Alokasi Waktu',p.waktu)+tr('Tujuan Pembelajaran',p.tujuan)}</table><table><tr><th>Tahapan</th><th>Alokasi Waktu</th><th>Kegiatan Guru / Pengalaman Belajar Murid</th></tr>
 <tr><td><b>AWAL</b></td><td>${esc(p.awal_w)} menit</td><td>${nl(p.awal)}</td></tr><tr><td><b>INTI</b></td><td>${esc(p.inti_w)} menit</td><td><b>MEMAHAMI</b><br>${nl(p.memahami)}<br><br><b>MENGAPLIKASIKAN</b><br>${nl(p.mengaplikasikan)}<br><br><b>MEREFLEKSI</b><br>${nl(p.merefleksi)}</td></tr><tr><td><b>PENUTUP</b></td><td>${esc(p.tutup_w)} menit</td><td>${nl(p.tutup)}</td></tr></table>`});
 h+=`<h3>ASESMEN PEMBELAJARAN</h3><table>${tr('Asesmen Awal (Diagnostik)',v.diagnostik)+tr('Asesmen Formatif',v.formatif)+tr('Asesmen Sumatif',v.sumatif)}</table><h3>TINDAK LANJUT</h3><table>${tr('Remedial',v.remedial)+tr('Pengayaan',v.pengayaan)}</table><h3>PENUTUP</h3><p>${nl(v.penutup)}</p>
 <table style="border:0"><tr><td style="border:0">Mengetahui,<br>Kepala Sekolah<br><br><br><br><b><u>${esc(v.kepsek)}</u></b><br>NIP. ${esc(v.nipk)}</td><td style="border:0">${esc(v.tempat)}<br>Guru/Mata Pelajaran<br><br><br><br><b><u>${esc(v.guru)}</u></b><br>NIP. ${esc(v.nipg)}</td></tr></table>
 <h3>LAMPIRAN</h3><h4>A. Rubrik Asesmen</h4><table><tr><th>Aspek yang Dinilai</th><th>Sangat Baik (4)</th><th>Baik (3)</th><th>Cukup (2)</th><th>Perlu Bimbingan (1)</th></tr>${(v.rubrik||'').split('\n').filter(x=>x.includes('|')).map(r=>'<tr>'+r.split('|').map(c=>`<td>${esc(c.trim())}</td>`).join('')+'</tr>').join('')}</table>
 <h4>B. Lembar Kerja Murid (LKPD)</h4><p>Nama: ........................ Kelas: ........</p><p>${nl(v.lkpd)}</p><h4>C. Materi Ajar</h4><p>${nl(v.materi)}</p><h4>D. Glosarium</h4><p>${nl(v.glosarium)}</p><h4>E. Daftar Pustaka</h4><p>${nl(v.pustaka)}</p>`;
 const sisa=IMG.map((g,i)=>[i+1,g]).filter(a=>!USED.has(a[0]));if(sisa.length)h+='<h4>F. Galeri Gambar</h4>'+sisa.map(a=>fig(a[0],a[1])).join('');
 return h}
function dl(){
 // Format MHTML: gambar ikut tertanam di dalam file .doc (dibuka oleh Microsoft Word)
 const ns=new Set(),base='file:///C:/modul/';
 const html=doc().replace(/<img src="data:[^"]+" data-n="(\d+)"/g,(m,n)=>{ns.add(n);return `<img src="${base}gambar${n}.jpg" data-n="${n}"`});
 const B='----=_ModulAjar_'+Date.now();
 let m=`MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${B}"; type="text/html"\r\n\r\n--${B}\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: 8bit\r\nContent-Location: ${base}modul.htm\r\n\r\n<html><head><meta charset="utf-8"><style>table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4px;vertical-align:top}</style></head><body>${html}</body></html>\r\n`;
 ns.forEach(n=>{m+=`--${B}\r\nContent-Type: image/jpeg\r\nContent-Transfer-Encoding: base64\r\nContent-Location: ${base}gambar${n}.jpg\r\n\r\n${IMG[n-1].s.split(',')[1].replace(/.{76}/g,'$&\r\n')}\r\n`});
 m+=`--${B}--`;
 const b=new Blob([m],{type:'application/msword'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`Modul-Ajar-${D.v.mapel||'PJOK'}.doc`;a.click()}
